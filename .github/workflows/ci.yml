name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Environment & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Execute Database Schema Migrations Check
        run: |
          python backend/migrate.py status
          python backend/migrate.py up

      - name: Run Backend Unit & Integration Tests
        run: |
          # Start background server for HTTP integration tests
          python backend/server.py &
          SERVER_PID=$!
          sleep 2
          
          # Run full test suite
          python -m unittest discover backend/tests
          
          # Clean shutdown of server
          kill $SERVER_PID || true

  frontend-build-and-test:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Type Check & Unit Tests
        run: |
          npx tsc -b
          npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Archive Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
