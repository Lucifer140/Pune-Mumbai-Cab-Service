[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sangita-travels-backend"
version = "1.0.0"
description = "High-performance modular REST API and SPA server for Sangita Travels Pune (Pune-Mumbai Cab Service)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
    { name = "Sangita Travels Tech Team", email = "shitalupadhye287@gmail.com" }
]
maintainers = [
    { name = "Sangita Travels", email = "shitalupadhye287@gmail.com" }
]
keywords = [
    "cab-booking",
    "taxi-service",
    "pune-mumbai",
    "sangita-travels",
    "http-server",
    "sqlite3",
    "rest-api"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Customer Service",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Operating System :: OS Independent",
]
# Runtime dependencies:
# Pure Python standard library implementation (http.server, sqlite3, hashlib, secrets, urllib).
# Zero external runtime dependencies required for lean, resilient execution.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<3.0.0",
]

[project.urls]
Homepage = "http://localhost:8080"
Documentation = "https://github.com/sangitatravels"

[project.scripts]
sangita-server = "server:main"
sangita-migrate = "migrate:run_migration"

[tool.setuptools]
packages = ["core", "controllers", "repositories"]
py-modules = ["server", "router", "migrate"]

[tool.setuptools.package-data]
"*" = ["schema.sql", ".env.example"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
